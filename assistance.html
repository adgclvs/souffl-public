<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souffl – Assistance</title>
  <meta name="description" content="Assistance de l'application Souffl : une question, un souci, une idée ? Écrivez-nous.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2024;
      --muted: #5c5f68;
      --line: #e3e4e8;
      --accent: #c8323c;
      --card: #f6f6f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c21;
        --text: #ececef;
        --muted: #a6a8b0;
        --line: #33353d;
        --accent: #ff5a64;
        --card: #24262c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    a { color: var(--accent); overflow-wrap: anywhere; }
    .lead { color: var(--muted); margin-bottom: 24px; }
    .summary { background: var(--card); border-left: 4px solid var(--accent); border-radius: 8px; padding: 16px 20px; margin: 24px 0; }
    .summary p:last-child { margin-bottom: 0; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Assistance Souffl</h1>
  <p class="lead">Une question, un souci avec l'application ou votre abonnement, une idée de séance ? Écrivez-nous, nous vous répondons rapidement.</p>

  <div class="summary">
    <p><strong>Nous contacter</strong></p>
    <p><a href="mailto:adrien.entreprise.dev@gmail.com">adrien.entreprise.dev@gmail.com</a></p>
  </div>

  <footer>Souffl · Adrien Goncalves EI · <a href="./">Politique de confidentialité</a> · <a href="conditions.html">Conditions d'utilisation</a></footer>
</main>
</body>
</html>
